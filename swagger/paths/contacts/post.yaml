post:
  tags:
    - Contacts
  summary: Create a new contact
  operationId: createContact
  description: Add a new contact to the user's list. Requires authentication.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - phone
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              example: jane.doe@example.com
            phone:
              type: string
              example: '098-765-4321'
            favorite:
              type: boolean
              example: true
  responses:
    '201':
      description: Contact successfully created
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  contact:
                    $ref: '../../components/schemas/contact.yaml' # Правильний шлях
    '400':
      description: Bad Request (Validation error)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: 'Validation error'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
