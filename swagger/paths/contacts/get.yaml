get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieve a list of all contacts for the authenticated user. Supports pagination.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of contacts per page
    - in: query
      name: favorite
      schema:
        type: boolean
      description: Filter contacts by favorite status
  responses:
    '200':
      description: Successful response with a list of contacts
      content:
        application/json:
          schema:
            type: object
            properties:
              contacts:
                type: array
                items:
                  $ref: '../../components/schemas/contact.yaml'
              total:
                type: integer
                description: Total number of contacts
              page:
                type: integer
                description: Current page number
              limit:
                type: integer
                description: Number of contacts per page
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
