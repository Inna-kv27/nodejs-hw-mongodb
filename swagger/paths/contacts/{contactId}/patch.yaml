patch:
  tags:
    - Contacts
  summary: Update a contact by ID
  operationId: updateContactById
  description: Update specific fields of an existing contact by its ID. Requires authentication.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: ID of the contact to update
      example: 60d5ec49f3e4e9001c8c4a4a
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              example: jane.doe@example.com
            phone:
              type: string
              example: '098-765-4321'
            favorite:
              type: boolean
              example: true
          minProperties: 1
          example:
            favorite: true
  responses:
    '200':
      description: Contact successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  contact:
                    $ref: '../../../components/schemas/contact.yaml'
    '400':
      description: Bad request (e.g., validation error, missing fields to update)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: 'Validation error'
    '404':
      $ref: '../../../components/responses/notFound.yaml'
    '401':
      $ref: '../../../components/responses/unauthorized.yaml'
