post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Creates a new user account.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: user@example.com
            password:
              type: string
              format: password
              minLength: 6
              example: password123
  responses:
    '201':
      description: User successfully registered
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  email:
                    type: string
                    example: user@example.com
                  subscription:
                    type: string
                    example: starter
    '400':
      description: Bad request (e.g., validation error)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: missing required field email
    '409':
      description: Conflict (e.g., email already in use)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Email in use
