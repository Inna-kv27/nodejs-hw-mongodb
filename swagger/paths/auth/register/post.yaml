# swagger/paths/auth/register/post.yaml
post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Creates a new user account.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name # Додайте це, якщо ваш сервер вимагає name при реєстрації
            - email
            - password
          properties:
            name: # Додайте це, якщо ваш сервер вимагає name при реєстрації
              type: string
              example: John Doe
              description: User's full name
            email:
              type: string
              format: email
              example: user@example.com
            password:
              type: string
              minLength: 6
              example: 'password123'
  responses:
    '201':
      description: User successfully registered
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/registeredUserResponse.yaml'
    '400':
      description: Bad request (e.g., validation error)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Validation error'
              data:
                type: array
                items:
                  type: string
                  example: 'Name is required'
    '409':
      description: Conflict (e.g., email already in use)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 409
              message:
                type: string
                example: 'Email already in use'
